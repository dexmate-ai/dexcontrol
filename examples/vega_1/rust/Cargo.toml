[package]
name = "dexcontrol-examples"
version = "0.8.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only OR LicenseRef-Dexmate-Commercial"
publish = false
autobins = false

[dependencies]
dexcontrol = { path = "../../../rust/dexcontrol" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[workspace]

[[bin]]
name = "control-close-hand"
