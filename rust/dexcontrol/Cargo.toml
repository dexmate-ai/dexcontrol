[package]
publish = ["crates-io"]
name = "dexcontrol"
version = "0.8.1"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/dexmate-ai/dexcontrol"
description = "Safe Rust API for the precompiled DexControl robot runtime"
links = "dexcontrol_capi"
include = ["build.rs", "header.sha256", "src/ffi/mod.rs", "src/ffi/bindings.rs", "src/ffi/constants.rs", "src/lib.rs", "src/component.rs", "src/diagnostics.rs", "src/motion.rs", "src/options.rs", "src/robot.rs", "src/sensors.rs", "examples/read_joint_positions.rs", "Cargo.toml", "LICENSE", "NOTICE", "LICENSE-HEADER"]

[build-dependencies]
pkg-config = "0.3"
